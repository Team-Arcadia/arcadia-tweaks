org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=arcadiatweaks
mod_name=ArcadiaTweaks
mod_version=0.2.0
mod_license=MIT
mod_authors=Curveo, Team Arcadia, vyrriox
mod_description=Umbrella mod-patch for the Arcadia modpack. Non-invasive, Mixin-based optimizations and fixes for BotanyPots, Refined Storage, Mekanism, Waystones and Simply Swords, plus server safety guards.
mod_group=com.teamarcadia
mod_main_package=com.teamarcadia.arcadiatweaks
mod_credits=Darkhax (BotanyPots) - SpongePowered (Mixin) - NeoForged team

# Toolchain
minecraft_version=1.21.1
neoforge_version=21.1.221
parchment_minecraft_version=1.21
parchment_version=2024.07.28

