# Source of truth: the mods/ folder of the production Arcadia modpack.
botanypots_version=21.1.44
bookshelf_version=21.1.81
prickle_version=21.1.11
refinedstorage_version=2.0.9
mekanism_version=10.7.19.85
waystones_version=21.1.46
balm_version=21.0.66
ftbteams_version=2101.1.11
ftblibrary_version=2101.1.37
architectury_version=13.0.11
simplyswords_version=1.70.2-1.21.1
# Simply Swords runtime dependencies (dev runs and GameTests only, never compiled against).
simplytooltips_version=0.1.5
fzzyconfig_version=0.7.7
kotlinforforge_version=5.12.0
# Accessories module: the optimizations are pinned to this exact Accessories build.
